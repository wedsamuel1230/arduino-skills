name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
      
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSION_NUM=${{ steps.version.outputs.version_number }}
          
          # Extract section for this version from CHANGELOG.md
          awk "/^## \[${VERSION_NUM}\]/,/^## \[/" {
            if (/^## \[${VERSION_NUM}\]/) {
              flag=1
              next
            }
            if (/^## \[/ && flag) {
              exit
            }
            if (flag) print
          } CHANGELOG.md | head -n -1 > release_notes.txt
          
          # If extraction failed, use fallback message
          if [ ! -s release_notes.txt ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > release_notes.txt
          fi
          
          # Store multi-line output
          NOTES=$(cat release_notes.txt)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate Release
        run: |
          echo "✅ Release ${{ steps.version.outputs.version }} created successfully"
          echo "📝 Release Notes:"
          cat release_notes.txt
